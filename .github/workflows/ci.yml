name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - run: deno install --frozen
      - run: deno fmt --check
      - run: deno task check
      - run: deno task test
      - run: deno task build
      - name: committed dist/ matches a fresh build
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || { echo "dist/ is stale: run deno task build and commit it"; exit 1; }
