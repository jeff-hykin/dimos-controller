name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.x
      - run: deno install --frozen
      - run: deno fmt --check
      - run: deno task check
      - run: deno task test
      - run: deno task build
